name: Recover Apple Silicon release
on:
  workflow_run:
    workflows: [Native desktop release]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed native release run with four passing platforms
        type: string
        required: true
      source_sha:
        description: Exact 40-character commit SHA of that release run
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: decals-apple-release
  cancel-in-progress: false
jobs:
  apple:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate original builds and artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
        run: node --test tests/apple-recovery.test.cjs && node scripts/validate-apple-recovery.cjs
      - name: Check out the exact original release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run setup:converter
      - run: npm run build:icons && npm run dist:mac -- --arm64 --publish never
      - run: npm run test:package
      - run: node scripts/release-manifest.cjs mac arm64
      - uses: actions/upload-artifact@v6
        with:
          name: release-mac-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/v${{ steps.source.outputs.version }}/SlotForgeDecals-*
            dist/v${{ steps.source.outputs.version }}/SHA256SUMS-*.txt
      - name: Keep diagnostic screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-recovered-mac-arm64
          path: test-output/**/*.png
          if-no-files-found: ignore
  publish:
    needs: apple
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.apple.outputs.sha }}
          persist-credentials: false
      - name: Check out the release attachment helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-tools
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Retrieve original source archives and four tested platforms
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || github.event.workflow_run.id }}
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Retrieve the tested Apple Silicon build
        uses: actions/download-artifact@v6
        with:
          name: release-mac-arm64
          path: release-assets
      - name: Verify and publish the complete original release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.apple.outputs.sha }}
        run: |
          cd release-assets
          for manifest in SHA256SUMS-*.txt; do sha256sum -c "$manifest"; done
          cd ..
          # The recovery workflow has a newer commit. Tag the original tested source.
          GITHUB_SHA="$SOURCE_SHA" node workflow-tools/scripts/publish-recovered-apple.cjs
