<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Making artwork redesign</title>
<!-- Preview only: made-up artwork, nothing is wired up. Two concepts for creating text, numbers and shapes, and for recolouring and editing vector artwork. -->
<style>
@font-face{font-family:'SF Barlow Condensed';src:url('../../../renderer/fonts/barlowcondensed/BarlowCondensed-BoldItalic.ttf') format('truetype');font-weight:700;font-style:italic}
@font-face{font-family:'SF Roboto Mono';src:url('../../../renderer/fonts/robotomono/RobotoMono[wght].ttf') format('truetype');font-weight:100 700}
:root{--bg:#14181e;--canvas:#101318;--panel:#1d232b;--raised:#252c36;--ink:#e8e6e1;--ink2:#c4c8ce;--muted:#98a0ab;--faint:#6b7380;--line:#323946;--line2:#272d37;--accent:#e5484d;--ok:#3ecf8e;--blue:#79b5ed;--teal:#5cc8c0;
  --cond:'SF Barlow Condensed','Bahnschrift',sans-serif;--mono:'SF Roboto Mono',Consolas,monospace;--ui:'Segoe UI',system-ui,sans-serif;color-scheme:dark}
[data-theme=light]{--bg:#f1efea;--canvas:#e4e1da;--panel:#fff;--raised:#f3f1ec;--ink:#1d2229;--ink2:#3a414c;--muted:#656c76;--faint:#8a929d;--line:#d9d6cf;--line2:#e6e3dd;--accent:#c92424;--ok:#1f9a62;--blue:#236db4;--teal:#17807a;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4{font-family:var(--cond);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0}
.eye{font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.grow{flex:1}.mono{font-family:var(--mono);font-weight:500}
.row{display:flex;align-items:center;gap:8px}
.switch{position:relative;z-index:50;display:flex;align-items:center;gap:14px;height:46px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line2)}
.switch b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.switch p{margin:0 0 0 auto;font-size:12px;color:var(--faint)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12.5px;white-space:nowrap}
.seg button.on{background:color-mix(in srgb,var(--ink) 12%,var(--panel));color:var(--ink);font-weight:600}
.seg.sm button{height:22px;padding:0 8px;font-size:12px}
.opt{position:absolute;inset:46px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);font-size:13px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{height:27px;padding:0 9px;font-size:12px}
.btn.icon{width:32px;padding:0}.btn.sm.icon{width:27px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}.propbar .swrow{flex-wrap:nowrap}
.field label{font-size:11px;color:var(--muted)}
.inp{display:flex;align-items:center;gap:6px;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--bg) 70%,var(--panel))}
.inp input,.inp select{flex:1;min-width:0;border:0;background:none;outline:0}
.inp span{color:var(--faint);font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw{display:inline-block;width:24px;height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.25);flex:none}
.swrow{display:flex;gap:5px;flex-wrap:wrap}
.swrow .sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.slider{position:relative;height:4px;border-radius:2px;background:var(--line);margin:10px 0}
.slider i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.slider b{position:absolute;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#e3e3e3 25%,transparent 25%),linear-gradient(-45deg,#e3e3e3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3e3e3 75%),linear-gradient(-45deg,transparent 75%,#e3e3e3 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
/* fake Workbench editor */
.ed{position:absolute;inset:0;display:flex;flex-direction:column}
.ed .top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;flex:none}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;font:700 italic 17px var(--cond)}
.ed .body{flex:1;display:flex;min-height:0}
.ed .rail{width:60px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:10px}
.ed .rail button{display:flex;flex-direction:column;align-items:center;gap:3px;width:48px;padding:6px 0 4px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:10px}
.ed .rail button svg{width:19px;height:19px}
.ed .rail button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.ed .lp{width:282px;background:var(--panel);border-right:1px solid var(--line)}
.ed .cv{flex:1;position:relative;display:grid;place-items:center;background:var(--canvas);overflow:hidden}
.ed .rp{width:322px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.ph{height:12px;margin:16px;border-radius:5px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.paper{position:relative;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.scrim{position:absolute;inset:0;background:rgba(8,10,14,.6);backdrop-filter:blur(2px)}
[data-theme=light] .scrim{background:rgba(60,55,45,.32)}
.sel{outline:2px solid #2f8cff;outline-offset:3px}

/* ================= A · CREATE WINDOW ================= */
.win{position:absolute;inset:28px 40px;display:grid;grid-template-columns:200px 1fr 330px;grid-template-rows:auto 1fr auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.win header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.win header h2{font-size:22px}
.cats{display:flex;flex-direction:column;gap:3px;padding:14px 10px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--ink) 2%,var(--panel))}
.cat{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--ink2);font-size:13px;text-align:left}
.cat svg{width:18px;height:18px;color:var(--muted)}
.cat.on{background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--ink);font-weight:600}
.cat.on svg{color:var(--accent)}
.cats hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.cats .team{margin-top:auto;padding:10px;border-top:1px solid var(--line2)}
.mid{display:flex;flex-direction:column;min-width:0;background:color-mix(in srgb,#000 22%,var(--bg))}
[data-theme=light] .mid{background:#e4e1da}
.tpl{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel);overflow:hidden}
.tp{display:flex;flex-direction:column;align-items:center;gap:5px;width:104px;flex:none;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--raised);font-size:11px;color:var(--ink2)}
.tp .th{width:90px;height:58px;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden}
.tp.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stage{flex:1;display:grid;place-items:center;position:relative;padding:20px}
.stage .note{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:var(--muted);font:500 11.5px var(--mono)}
.side{display:flex;flex-direction:column;gap:14px;padding:18px;border-left:1px solid var(--line);overflow:auto}
.side h3{font-size:16px}
.win footer{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.big{height:46px}.big input{font-size:22px;font-family:var(--mono)}
.numlist{display:flex;flex-wrap:wrap;gap:5px}
.numlist span{display:grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;background:var(--raised);border:1px solid var(--line);font:500 12px var(--mono)}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.pair .sw{width:34px;height:34px;border-radius:9px}
.pair .arr{color:var(--faint)}
.pair small{display:block;color:var(--muted);font:500 11px var(--mono)}
.palettes{display:flex;flex-direction:column;gap:6px}
.pal{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:none;font-size:12px;color:var(--ink2)}
.pal i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2)}
.layers{display:flex;flex-direction:column;gap:2px}
.lr{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;font-size:12.5px}
.lr.on{background:color-mix(in srgb,#2f8cff 16%,transparent)}
.lr .sw{width:22px;height:22px}
.lr small{color:var(--faint);font-size:11px;margin-left:auto}

/* ================= B · ON THE CANVAS ================= */
.fly{position:absolute;left:68px;top:66px;width:300px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:6;overflow:hidden}
.fly header{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.fly h3{font-size:15px}
.fly .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.fly .cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--raised);font-size:11px;color:var(--ink2)}
.fly .cell .th{width:64px;height:42px;border-radius:5px;background:#fff;display:grid;place-items:center}
.fly .cell.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fly footer{padding:10px 14px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--muted)}
.ghost-draw{position:absolute;border:2px dashed #2f8cff;background:color-mix(in srgb,#2f8cff 10%,transparent)}
.ghost-draw .dim{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:6px;background:#2f8cff;color:#fff;font:500 11px var(--mono);white-space:nowrap}
.cursor{position:absolute;width:14px;height:14px;border-left:2px solid #111;border-top:2px solid #111;transform:rotate(-20deg)}
.propbar{position:absolute;display:flex;align-items:center;gap:6px;padding:5px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:5;white-space:nowrap}
.propbar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.propbar select,.propbar .mini{height:28px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 8px;font-size:12px}
.caret{display:inline-block;width:2px;height:1em;background:#2f8cff;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.modebar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 14px 40px rgba(0,0,0,.45);white-space:nowrap;z-index:6}
.modebar .sep{width:1px;height:26px;background:var(--line)}
.dimc{position:absolute;inset:0;background:rgba(6,8,12,.55);z-index:2}
[data-theme=light] .dimc{background:rgba(40,36,30,.4)}
.palette-strip{display:flex;flex-direction:column;gap:8px}
.ps{display:flex;align-items:center;gap:10px}
.ps .sw{width:30px;height:30px;border-radius:8px}
.ps .bar{flex:1;display:flex;gap:4px}
.ps .bar i{flex:1;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.2)}
.ps .bar i.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h3{font-size:14px;margin-bottom:10px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></symbol>
 <symbol id="i-hash" viewBox="0 0 24 24"><path d="M10 4L8 20M16 4l-2 16M5 9h15M4 15h15"/></symbol>
 <symbol id="i-shape" viewBox="0 0 24 24"><path d="M4 4h8v8H4zM16.5 12a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></symbol>
 <symbol id="i-stripe" viewBox="0 0 24 24"><path d="M3 8h18M3 12h18M3 16h18"/></symbol>
 <symbol id="i-badge" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
 <symbol id="i-brush" viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6zM4 20h4"/></symbol>
 <symbol id="i-path" viewBox="0 0 24 24"><path d="M4 18C8 6 15 18 20 6M2.5 16.5h3v3h-3zM18.5 4.5h3v3h-3z"/></symbol>
 <symbol id="i-merge" viewBox="0 0 24 24"><path d="M9 5a6 6 0 1 0 0 12A6 6 0 0 0 9 5zM15 7a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></symbol>
 <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.6L9 19z"/></symbol>
 <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9h.01"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></symbol>
 <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10H9M4 9l4-4M4 9l4 4"/></symbol>
 <symbol id="i-drop" viewBox="0 0 24 24"><path d="M3 21l3-1 11-11-2-2L4 18zM14 6l4 4M17 3l4 4-2 2-4-4z"/></symbol>
 <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></symbol>
</defs></svg>

<div class="switch">
 <b>Design</b><div class="seg" id="sw-opt"><button class="on" data-v="A">A · Create window</button><button data-v="B">B · On the canvas</button></div>
 <b>Tool</b><div class="seg" id="sw-tool"><button class="on" data-v="text">Text</button><button data-v="numbers">Numbers</button><button data-v="shapes">Shapes &amp; stripes</button><button data-v="recolour">Recolour</button><button data-v="vector">Edit vector</button></div>
 <b>Theme</b><div class="seg" id="sw-theme"><button class="on" data-v="dark">Dark</button><button data-v="light">Light</button></div>
 <p>Preview only · made-up artwork</p>
</div>
<section class="opt" id="stage-root"></section>

<script>
const $ = s => document.querySelector(s);
const ICON = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const TEAM = ['#d92b2b', '#1d3f8f', '#ffffff', '#111111', '#f2711c'];
// little artwork pieces
const roundel = (n, w = 90, ring = '#d92b2b', bg = '#fff', ink = '#111') => `<svg viewBox="0 0 100 100" width="${w}" height="${w}"><circle cx="50" cy="50" r="45" fill="${bg}" stroke="${ring}" stroke-width="8"/><text x="50" y="72" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="64" fill="${ink}">${n}</text></svg>`;
const oval = (n, w = 90) => `<svg viewBox="0 0 120 80" width="${w}" height="${w * 2 / 3}"><ellipse cx="60" cy="40" rx="56" ry="36" fill="#fff" stroke="#111" stroke-width="5"/><text x="60" y="58" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="50" fill="#111">${n}</text></svg>`;
const plate = (n, w = 90, bg = '#1d3f8f') => `<svg viewBox="0 0 120 80" width="${w}" height="${w * 2 / 3}"><rect x="4" y="4" width="112" height="72" rx="10" fill="${bg}"/><text x="60" y="60" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="56" fill="#fff">${n}</text></svg>`;
const square = (n, w = 90) => `<svg viewBox="0 0 100 100" width="${w * .8}" height="${w * .8}"><rect x="4" y="4" width="92" height="92" fill="#f5c400" stroke="#111" stroke-width="5"/><text x="50" y="74" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="66" fill="#111">${n}</text></svg>`;
const driver = (w = 220, name = 'J. DE VRIES') => `<svg viewBox="0 0 220 34" width="${w}" height="${w * 34 / 220}"><rect width="220" height="34" rx="4" fill="#111"/><rect x="8" y="9" width="24" height="5.3" fill="#ae1c28"/><rect x="8" y="14.3" width="24" height="5.3" fill="#fff"/><rect x="8" y="19.6" width="24" height="5.3" fill="#21468b"/><text x="42" y="24" font-family="Segoe UI" font-weight="700" font-size="17" fill="#fff" letter-spacing="1">${name}</text></svg>`;
const sponsor = (w = 220, word = 'FORGE') => `<svg viewBox="0 0 220 70" width="${w}" height="${w * 70 / 220}"><text x="110" y="46" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="58" fill="#111">${word}</text><path d="M20 52h190l-8 8H12z" fill="#d92b2b"/></svg>`;
const arc = (w = 220) => `<svg viewBox="0 0 220 90" width="${w}" height="${w * 90 / 220}"><defs><path id="arcp" d="M20 80 Q110 0 200 80"/></defs><text font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="34" fill="#1d3f8f"><textPath href="#arcp" startOffset="50%" text-anchor="middle">CLUB RACING</textPath></text></svg>`;
const plain = (w = 220) => `<svg viewBox="0 0 220 50" width="${w}" height="${w * 50 / 220}"><text x="110" y="36" text-anchor="middle" font-family="Arial" font-size="30" fill="#111">27 Racing</text></svg>`;
const stripes = (n = 2, w = 220, cols = ['#d92b2b', '#1d3f8f', '#d92b2b']) => { let r = ''; const h = 14, g = 6; for (let i = 0; i < n; i++) r += `<rect y="${i * (h + g)}" width="220" height="${h}" fill="${cols[i % cols.length]}"/>`; return `<svg viewBox="0 0 220 ${n * (h + g) - g}" width="${w}" height="${w * (n * (h + g) - g) / 220}">${r}</svg>`; };
const checker = (w = 220) => { let r = ''; for (let y = 0; y < 3; y++) for (let x = 0; x < 16; x++) if ((x + y) % 2 === 0) r += `<rect x="${x * 13.75}" y="${y * 13.75}" width="13.75" height="13.75" fill="#111"/>`; return `<svg viewBox="0 0 220 41.25" width="${w}" height="${w * 41.25 / 220}"><rect width="220" height="41.25" fill="#fff" stroke="#111"/>${r}</svg>`; };
const chevron = (w = 90) => `<svg viewBox="0 0 100 60" width="${w}" height="${w * .6}"><path d="M5 5h30l25 25-25 25H5l25-25z" fill="#d92b2b"/><path d="M45 5h30l25 25-25 25H45l25-25z" fill="#1d3f8f"/></svg>`;
const star = (w = 70) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z" fill="#f2711c"/></svg>`;
const shield = (w = 70) => `<svg viewBox="0 0 60 66" width="${w}" height="${w * 1.1}"><path d="M30 3l26 8v20c0 17-12 27-26 32C16 58 4 48 4 31V11z" fill="#19253f" stroke="#d92b2b" stroke-width="4"/><text x="30" y="42" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="26" fill="#fff">SF</text></svg>`;
const logoVec = (w = 420, hidden = -1, sel = -1) => `<svg viewBox="0 0 220 110" width="${w}" height="${w / 2}"><rect width="220" height="110" fill="#fff" ${hidden === 0 ? 'opacity=".12"' : ''} ${sel === 0 ? 'stroke="#2f8cff" stroke-width="3" stroke-dasharray="6 4"' : ''}/><text x="110" y="62" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="58" fill="#111">FORGE</text><path d="M18 70h190l-9 10H9z" fill="#d92b2b" ${sel === 2 ? 'stroke="#2f8cff" stroke-width="3" stroke-dasharray="6 4"' : ''}/><text x="113" y="100" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="20" fill="#111" letter-spacing="3">RACING</text></svg>`;

const paper = (inner, w = 470) => `<div class="paper" style="width:${w}px;height:${w * 297 / 210}px">${inner}</div>`;
const sheetBits = `<div style="position:absolute;left:30px;top:30px;display:flex;gap:16px">${roundel(27, 54)}${roundel(27, 54)}${roundel(27, 54)}</div><div style="position:absolute;left:30px;top:104px">${sponsor(150)}</div><div style="position:absolute;left:30px;top:170px">${stripes(2, 200)}</div>`;

// ---------------- A · Create window ----------------
const CATS = [['text', 'text', 'Text'], ['numbers', 'hash', 'Racing numbers'], ['shapes', 'shape', 'Shapes'], ['stripes', 'stripe', 'Stripes & patterns'], ['badges', 'badge', 'Badges & flags']];
function A(tool) {
  const cat = tool === 'shapes' ? 'stripes' : tool;
  const win = (title, cats, mid, side, foot) => `${editor('Select', paper(sheetBits), '<div class="ph"></div><div class="ph"></div>')}<div class="scrim"></div><div class="win"><header><h2>${title}</h2><span class="faint">${tool === 'recolour' ? '4 decals selected' : tool === 'vector' ? 'Forge Racing · 34 × 14 mm' : 'Everything you make stays editable on the sheet'}</span><span class="grow"></span><button class="btn ghost sm icon">${ICON('x')}</button></header>${cats}<div class="mid">${mid}</div><aside class="side">${side}</aside><footer>${foot}</footer></div>`;
  const catRail = `<nav class="cats">${CATS.map(([id, ic, label]) => `<button class="cat ${id === cat ? 'on' : ''}">${ICON(ic)}${label}</button>`).join('')}<hr><button class="cat">${ICON('path')}Draw a path</button><div class="team"><span class="eye">Team colours</span><div class="swrow" style="margin-top:8px">${TEAM.map(c => `<span class="sw" style="background:${c}"></span>`).join('')}</div><span class="faint" style="font-size:11px;display:block;margin-top:6px">Used by every template here</span></div></nav>`;
  const tplRow = items => `<div class="tpl">${items.map(([th, label], n) => `<button class="tp ${n === 0 ? 'on' : ''}"><span class="th">${th}</span>${label}</button>`).join('')}</div>`;
  const addFoot = (what, n = 1) => `<button class="btn">Cancel</button><span class="grow"></span><span class="faint" style="font-size:12px">Lands in free space on page 1 · edit it later in the Decal tab</span><button class="btn primary">${ICON('check')}Add ${what}${n > 1 ? ` (${n})` : ''}</button>`;
  let html = '';
  if (tool === 'text') html = win('Create', catRail,
    tplRow([[driver(84), 'Driver name'], [sponsor(84), 'Sponsor'], [arc(84), 'Arched'], [plain(84), 'Plain'], [`<svg viewBox="0 0 80 40" width="70"><text x="40" y="30" text-anchor="middle" font-family="SF Barlow Condensed" font-style="italic" font-weight="700" font-size="30" fill="#d92b2b" stroke="#111" stroke-width="1.5">CUP</text></svg>`, 'Outlined']]) +
    `<div class="stage checker" style="background-size:20px 20px">${driver(520)}<span class="note">25.0 × 3.9 mm each · shown here at 20 × its size · 3 names</span></div>`,
    `<h3>Driver name</h3><div class="field"><label>Name</label><div class="inp"><input value="J. DE VRIES"></div></div><div class="field"><label>Flag</label><div class="row"><span class="btn sm">${ICON('flag')}Netherlands</span><span class="btn sm ghost">None</span></div></div><div class="field"><label>Typeface</label><div class="inp"><select><option>Segoe UI Bold</option></select></div></div><div class="g2"><div class="field"><label>Height</label><div class="inp"><input value="3.9"><span>mm</span></div></div><div class="field"><label>Letter spacing</label><div class="inp"><input value="1"></div></div></div><div class="field"><label>Colours</label><div class="row"><span class="faint" style="width:60px;font-size:11.5px">Letters</span><div class="swrow">${TEAM.map((c, n) => `<span class="sw ${n === 2 ? 'on' : ''}" style="background:${c}"></span>`).join('')}</div></div><div class="row" style="margin-top:6px"><span class="faint" style="width:60px;font-size:11.5px">Strip</span><div class="swrow">${TEAM.map((c, n) => `<span class="sw ${n === 3 ? 'on' : ''}" style="background:${c}"></span>`).join('')}</div></div></div><div class="field"><label>Several drivers? One per line</label><div class="inp" style="height:auto;padding:8px 10px;align-items:flex-start"><span style="color:var(--ink2);font-size:12.5px;line-height:1.6">J. DE VRIES<br>M. BAKKER<br>S. JANSEN</span></div></div>`,

    tplRow([[roundel(27, 52), 'Roundel'], [oval(27, 70), 'Oval'], [plate(27, 70), 'Plate'], [square(27, 64), 'Square'], [`<div style="display:flex;gap:4px">${roundel(27, 34)}${roundel(27, 34)}</div>`, 'Pair']]) +

    `<h3>Racing number</h3><div class="field"><label>Number</label><div class="inp big"><input value="27"></div></div><div class="field"><label>More numbers · one decal each</label><div class="inp"><input value="44, 51, 7"></div><div class="numlist" style="margin-top:6px"><span>27</span><span>44</span><span>51</span><span>7</span></div></div><div class="g2"><div class="field"><label>Size</label><div class="inp"><input value="18"><span>mm</span></div></div><div class="field"><label>Border</label><div class="inp"><input value="0.6"><span>mm</span></div></div></div><div class="field"><label>Typeface</label><div class="inp"><select><option>Barlow Condensed Bold Italic</option></select></div></div><div class="field"><label>Colours</label>${[['Background', 2], ['Number', 3], ['Border', 0]].map(([l, on]) => `<div class="row" style="margin-top:4px"><span class="faint" style="width:76px;font-size:11.5px">${l}</span><div class="swrow">${TEAM.map((c, n) => `<span class="sw ${n === on ? 'on' : ''}" style="background:${c}"></span>`).join('')}</div></div>`).join('')}</div><div class="field"><label>For each number</label><div class="seg sm"><button class="on">1 decal</button><button>Pair · both sides</button><button>3 · sides + bonnet</button></div></div>`,
    addFoot('numbers', 4));
  if (tool === 'shapes') html = win('Create', catRail,
    tplRow([[stripes(2, 80), 'Twin stripes'], [stripes(3, 80, ['#d92b2b', '#fff', '#1d3f8f']), 'Tricolour'], [checker(80), 'Chequered'], [chevron(70), 'Chevrons'], [`<svg viewBox="0 0 100 30" width="80"><path d="M0 30L30 0h20L20 30zM30 30L60 0h20L50 30z" fill="#d92b2b"/></svg>`, 'Hash marks']]) +
    `<div class="stage checker" style="background-size:20px 20px">${stripes(2, 560)}<span class="note">66 × 5 mm · 2 stripes, 1 mm apart · stays one editable pattern</span></div>`,
    `<h3>Twin stripes</h3><div class="g2"><div class="field"><label>Length</label><div class="inp"><input value="66"><span>mm</span></div></div><div class="field"><label>Total height</label><div class="inp"><input value="5"><span>mm</span></div></div></div><div class="field"><label>Stripes</label><div class="seg sm"><button>1</button><button class="on">2</button><button>3</button><button>4</button><button>5</button></div></div><div class="field"><label>Gap between stripes · 1 mm</label><div class="slider"><i style="width:30%"></i><b style="left:30%"></b></div></div><div class="field"><label>Stripe widths</label><div class="seg sm"><button class="on">Equal</button><button>Wide + thin</button><button>Custom</button></div></div><div class="field"><label>Colours, top to bottom</label>${[0, 1].map(on => `<div class="swrow" style="margin-top:4px">${TEAM.map((c, n) => `<span class="sw ${n === on ? 'on' : ''}" style="background:${c}"></span>`).join('')}</div>`).join('')}</div><div class="field"><label>Ends</label><div class="seg sm"><button class="on">Square</button><button>Slanted</button><button>Rounded</button></div></div>`,

    `<div class="stage" style="gap:30px;grid-auto-flow:column"><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="eye">Now</span><div class="checker" style="padding:18px;border-radius:10px;display:flex;gap:12px">${roundel(27, 80)}${sponsor(170)}</div></div><div style="font-size:26px;color:var(--faint)">→</div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="eye">After</span><div class="checker" style="padding:18px;border-radius:10px;display:flex;gap:12px">${roundel(27, 80, '#1d3f8f')}${sponsor(170).replace('#d92b2b', '#1d3f8f')}</div></div></div>`,

// ---------------- B · On the canvas ----------------
function B(tool) {

  if (tool === 'text') {
    rail = 'Text';
    cv = paper(sheetBits + `<div style="position:absolute;left:170px;top:330px;padding:4px 6px;outline:2px solid #2f8cff;outline-offset:2px;font:700 italic 34px var(--cond);color:#111;text-transform:uppercase">Club Racing<span class="caret"></span></div><div class="propbar" style="left:60px;top:272px"><select><option>Barlow Condensed</option></select><button class="btn sm icon" style="font-weight:700">B</button><button class="btn sm icon" style="font-style:italic">I</button><span class="sep"></span><span class="faint" style="font-size:11.5px">Bend</span><div class="slider" style="width:80px;margin:0"><i style="width:50%"></i><b style="left:50%"></b></div><span class="faint" style="font-size:11.5px">Spacing</span><span class="mini mono" style="display:inline-flex;align-items:center">0</span><span class="sep"></span><div class="swrow">${TEAM.slice(0, 4).map((c, n) => `<span class="sw ${n === 3 ? 'on' : ''}" style="background:${c};width:20px;height:20px"></span>`).join('')}</div></div>`) +

    rp = `<div class="sec"><h3>Text</h3><p class="muted" style="margin:0;font-size:12px">Editing on the sheet. The bar above the text has the font, bend, spacing and colour.</p></div><div class="ph"></div>`;
  }
  if (tool === 'numbers') {
    rail = 'Number';
    cv = paper(sheetBits + `<div style="position:absolute;left:30px;top:250px;display:flex;gap:12px;opacity:.85">${[27, 44, 51, 7].map(n => roundel(n, 54)).join('')}</div><div class="ghost-draw" style="left:22px;top:242px;width:270px;height:70px"><span class="dim">4 roundels · 18 mm · click to place</span></div>`) +
      `<div class="fly" style="width:320px"><header>${ICON('hash')}<h3>Racing numbers</h3></header><div class="grid">${[[roundel(27, 38), 'Roundel'], [oval(27, 54), 'Oval'], [plate(27, 54), 'Plate'], [square(27, 46), 'Square'], [`<div style="display:flex;gap:3px">${roundel(27, 26)}${roundel(27, 26)}</div>`, 'Pair'], [plate(27, 54, '#d92b2b'), 'Red plate']].map(([th, l], n) => `<button class="cell ${n === 0 ? 'on' : ''}"><span class="th">${th}</span>${l}</button>`).join('')}</div><div style="padding:0 14px 12px;display:flex;flex-direction:column;gap:10px"><div class="field"><label>Numbers</label><div class="inp"><input value="27, 44, 51, 7"></div></div><div class="g2"><div class="field"><label>Size</label><div class="inp"><input value="18"><span>mm</span></div></div><div class="field"><label>Colours</label><div class="swrow">${TEAM.slice(0, 4).map((c, n) => `<span class="sw ${n === 0 ? 'on' : ''}" style="background:${c};width:22px;height:22px"></span>`).join('')}</div></div></div></div><footer>The numbers follow your mouse; click on the sheet to drop them.</footer></div>`;
    rp = `<div class="ph"></div><div class="ph" style="width:55%"></div>`;
  }
  if (tool === 'shapes') {
    rail = 'Shape';
    cv = paper(sheetBits + `<div class="ghost-draw" style="left:40px;top:260px;width:300px;height:26px">${stripes(2, 296)}<span class="dim">66.0 × 5.0 mm</span></div><span class="cursor" style="left:342px;top:288px"></span>`) +
      `<div class="fly"><header>${ICON('shape')}<h3>Shapes &amp; stripes</h3><span class="grow"></span><span class="faint" style="font-size:11px">drag on the sheet</span></header><div class="grid">${[[`<svg viewBox="0 0 40 26" width="40"><rect x="2" y="2" width="36" height="22" fill="#d92b2b"/></svg>`, 'Rectangle'], [`<svg viewBox="0 0 40 40" width="30"><circle cx="20" cy="20" r="17" fill="#1d3f8f"/></svg>`, 'Circle'], [star(30), 'Star'], [stripes(2, 56), 'Twin stripes'], [stripes(3, 56, ['#d92b2b', '#fff', '#1d3f8f']), 'Tricolour'], [checker(56), 'Chequered'], [chevron(48), 'Chevrons'], [shield(30), 'Shield'], [`<svg viewBox="0 0 40 26" width="44"><path d="M2 13h30M24 4l12 9-12 9" stroke="#d92b2b" stroke-width="5" fill="none"/></svg>`, 'Arrow']].map(([th, l], n) => `<button class="cell ${n === 3 ? 'on' : ''}"><span class="th">${th}</span>${l}</button>`).join('')}</div><footer>Shift keeps the shape's proportions; Alt draws from the centre.</footer></div>`;

  }
  if (tool === 'recolour') {
    cv = paper(sheetBits.replace(/#d92b2b/g, '#1d3f8f'));
    rp = `<div class="sec"><span class="eye">4 decals selected</span><h3 style="margin-top:6px">Colours in the selection</h3><p class="muted" style="margin:0 0 12px;font-size:12px">Click a colour, then a new one. The sheet changes as you go; Undo takes it back.</p><div class="palette-strip">${[['#1d3f8f', 'was red · 12 shapes', 1], ['#ffffff', 'white · 6 shapes', -1], ['#111111', 'black · 9 shapes', -1]].map(([c, l, on]) => `<div class="ps"><span class="sw" style="background:${c}"></span><span style="font-size:12px;flex:1">${l}</span></div>${on > 0 ? `<div class="ps"><div class="bar">${TEAM.concat(['#0e7a52', '#f5c400']).map((x, n) => `<i class="${n === 1 ? 'on' : ''}" style="background:${x}"></i>`).join('')}</div></div>` : ''}`).join('')}</div></div><div class="sec"><h3>Team palettes</h3><div class="palettes">${[['Blue team', ['#1d3f8f', '#fff', '#111']], ['Orange team', ['#f2711c', '#111', '#fff']]].map(([n, cs]) => `<button class="pal">${cs.map(c => `<i style="background:${c}"></i>`).join('')}${n}</button>`).join('')}</div></div><div class="sec"><button class="btn" style="width:100%">Make recoloured copies instead</button></div>`;
  }

  }
  $('#stage-root').innerHTML = editor(rail, cv, rp);
}

let opt = 'A', tool = 'text';
const draw = () => (opt === 'A' ? A(tool) : B(tool));
function pick(id, fn) { const s = document.getElementById(id); s.onclick = e => { const b = e.target.closest('button'); if (!b) return; s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); draw(); }; }
pick('sw-opt', v => (opt = v));
pick('sw-tool', v => (tool = v));
pick('sw-theme', v => (document.documentElement.dataset.theme = v));
const q = new URLSearchParams(location.search);
if (q.get('opt')) opt = q.get('opt');
if (q.get('tool')) tool = q.get('tool');
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
for (const [id, v] of [['sw-opt', opt], ['sw-tool', tool], ['sw-theme', document.documentElement.dataset.theme]]) document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
draw();
